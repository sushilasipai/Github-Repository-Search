<div class="container">
  <div class="header">
    <h2>Search Github Repository</h2>

    <div class="searcher">
      <div class="searcher__sort">
        <label class="searcher__sort__label">Sort By:</label>
        <select
          class="searcher__sort__dropdown"
          (change)="sortRepos($event.target.value)"
          [(ngModel)]="sortCriteria"
        >
          <!--<option [ngValue]="sortCriteria" selected hidden>Stars</option>-->
          <option value="stars" selected>Stars</option>
          <option value="forks">Forks</option>
          <option value="updated">Last Update</option>
        </select>
      </div>

      <div class="searcher__search">
        <input
          type="text"
          class="searcher__search__txtbox"
          id="repo_txtbox"
          placeholder="Github repository search"
          [(ngModel)]="repoSearchString"
          (keyup.enter)="searchRepos()"
        />
        <button class="searcher__search__btn" (click)="searchRepos()">
          Search
        </button>
      </div>

      <div class="searcher__pagination">
        <div class="searcher__pagination__itemsPerPage">
          <label class="searcher__pagination__label">#Items: </label>

          <select
            class="searcher__pagination__dropdown"
            (change)="itemPerPageChange($event.target.value)"
            [(ngModel)]="itemPerPage"
          >
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select>
        </div>
        <div class="searcher__pagination__controls" *ngIf="noOfPages">
          <button
            class="searcher__pagination__first"
            title="First Page"
            (click)="changePage(1)"
            [disabled]="page <= 1"
          >
            <i class="fas fa-angle-double-left"></i>
          </button>
          <button
            class="searcher__pagination__prev"
            title="Previous"
            (click)="changePage(page - 1)"
            [disabled]="page <= 1"
          >
            <i class="fas fa-angle-left"></i>
          </button>
          <label> Page:</label>
          <input
            type="number"
            class="searcher__pagination__txtbox"
            [(ngModel)]="page"
            placeholder="Pg No."
            (change)="changePage(page)"
          />

          <label> of {{ noOfPages }} </label>
          <button
            class="searcher__pagination__next"
            title="Next"
            (click)="changePage(page + 1)"
            [disabled]="page >= noOfPages"
          >
            <i class="fas fa-angle-right"></i>
          </button>
          <button
            class="searcher__pagination__last"
            title="Last Page"
            (click)="changePage(noOfPages)"
            [disabled]="page >= noOfPages"
          >
            <i class="fas fa-angle-double-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <h4 *ngIf="repos[0] == 'null'">Loading Data. Please wait!!</h4>

  <div class="card" *ngIf="repos && repos[0] != 'null'">
    <div
      class="card__info"
      *ngFor="let repo of repos"
      (click)="showDetails(repo.id)"
    >
      <div class="card__info__title">
        <div class="card__info__title__name" title="Repository name">
          {{ repo.name }}
        </div>
        <div class="card__info__title__author" title="Author">
          -{{ repo.owner.login }}
        </div>
      </div>
      <div class="card__info__body">
        {{ repo.description }}
      </div>
      <div class="card__info__footer">
        <div title="Stars">
          <i class="far fa-star"></i>
          {{ repo.stargazers_count }}
        </div>
        <div title="Watchers">
          <i class="far fa-eye"></i>
          {{ repo.watchers_count }}
        </div>
        <div title="Forks">
          <i class="fas fa-code-branch"></i>
          {{ repo.forks_count }}
        </div>
        <div title="Last Update">
          <i class="fas fa-edit"></i>
          {{ repo.updated_at | date: "medium":"UTC" }}
        </div>
      </div>
    </div>
    <div class="card__info-hidden" *ngIf="itemPerPage == 25"></div>
